name: Release

on:
    push:
        branches: [main]
    workflow_dispatch: {}

permissions:
    contents: write
    packages: write

jobs:
    version:
        runs-on: ubuntu-latest
        outputs:
            new_tag: ${{ steps.semver.outputs.new_tag }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v7
              with:
                  node-version: 22

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            # Installs devDependencies so that the plugins listed in
            # .releaserc.json (e.g. @semantic-release/git) can be resolved.
            - name: Install dependencies
              shell: bash
              run: bun install

            - name: Semantic versioning (semantic-release)
              id: semver
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # Analyzes conventional commits since the last tag and, when a
                  # bump is warranted, prepends the notes to CHANGELOG.md, commits
                  # it with the version bump, and publishes the tag + GitHub release.
                  npx --yes semantic-release@24

                  # Detect whether this push was released: semantic-release tags HEAD.
                  git fetch --force --tags
                  TAG="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
                  if [ -n "$TAG" ] && [ "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)" ]; then
                    echo "new_tag=${TAG}" >> "$GITHUB_OUTPUT"
                  fi

    build:
        needs: version
        if: needs.version.outputs.new_tag != ''
        # The artifact name doubles as the GitHub release asset name. Linux
        # builds keep bare names (client, client-arm, server) so the deb stage
        # picks up the Linux clients by name; other platforms are suffixed with
        # an OS label.
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      name: client
                      target: bun-linux-x64
                      entrypoint: ./client/backend/client.ts
                      native: true
                      profile: true
                      ext: ""
                    - os: ubuntu-latest
                      name: client-arm
                      target: bun-linux-arm64
                      entrypoint: ./client/backend/client.ts
                      native: false
                      profile: false
                      ext: ""
                    - os: ubuntu-latest
                      name: server
                      target: bun-linux-x64
                      entrypoint: ./server/main.ts
                      native: true
                      profile: false
                      ext: ""
                    - os: macos-latest
                      name: client-macos
                      target: bun-darwin-arm64
                      entrypoint: ./client/backend/client.ts
                      native: true
                      profile: true
                      ext: ""
                    - os: windows-latest
                      name: client-windows
                      target: bun-windows-x64
                      entrypoint: ./client/backend/client.ts
                      native: true
                      profile: false
                      ext: ".exe"
        runs-on: ${{ matrix.os }}
        steps:
            # Check out the release tag, not the trigger commit:
            # semantic-release commits the package.json bump in the `version`
            # job, so github.sha still carries the previous version and the
            # binaries would embed the stale APP_VERSION.
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.version.outputs.new_tag }}

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              shell: bash
              run: bun install

            # Generated before every compile: module manifests, page manifests,
            # and the control-server web UI the client embeds
            # (shared/frontend.ts → generated/frontend-assets.ts).
            - name: Generate module manifests
              shell: bash
              run: bun run gen:modules

            - name: Generate pages
              shell: bash
              run: bun run gen:pages

            - name: Generate control-server assets
              shell: bash
              run: bun scripts/gen_control_server_assets.ts

            - name: Build profiling binaries (profiled targets only)
              if: matrix.profile == true
              shell: bash
              run: |
                  bun build --compile --minify --sourcemap \
                    --target=${{ matrix.target }} \
                    ${{ matrix.entrypoint }} \
                    --outfile prof-${{ matrix.name }}${{ matrix.ext }}

            - name: Record bytecode profiles (profiled targets only)
              if: matrix.profile == true
              shell: bash
              run: |
                  BUN_BYTECODE_ORDER_OUT=client.order ./prof-${{ matrix.name }}${{ matrix.ext }} --help

            - name: Build final binaries
              shell: bash
              run: |
                  ARGS="--compile --minify --sourcemap --format=esm --bytecode \
                    --target=${{ matrix.target }} \
                    ${{ matrix.entrypoint }} \
                    --outfile ${{ matrix.name }}${{ matrix.ext }}"
                  if [ -f client.order ]; then
                    ARGS="$ARGS --bytecode-order=client.order"
                  fi
                  bun build $ARGS

            - name: Verify binaries (profiled targets only)
              if: matrix.profile == true
              shell: bash
              run: |
                  chmod +x ${{ matrix.name }}${{ matrix.ext }} || true
                  ./${{ matrix.name }}${{ matrix.ext }} --help

            - uses: actions/upload-artifact@v7
              with:
                  # Bare name key so the Linux client/client-arm stay
                  # fetchable by name from the deb stage; the asset file itself
                  # carries the platform extension.
                  name: ${{ matrix.name }}
                  path: ${{ matrix.name }}${{ matrix.ext }}

    deb:
        needs: [version, build]
        if: needs.version.outputs.new_tag != ''
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.version.outputs.new_tag }}

            # Reuse the compiled Linux client binaries from the build job — the
            # deb wraps them plus the module install sidecar trees (the exact
            # layout scripts/package_client.ts ships for the on-device deploy
            # bundle). Fetched by exact name so the macOS/Windows clients are
            # never pulled in.
            - name: Download Linux client binaries
              uses: actions/download-artifact@v8
              with:
                  name: client
                  path: dist

            - name: Download Linux client-arm binary
              uses: actions/download-artifact@v8
              with:
                  name: client-arm
                  path: dist

            - name: Build .deb packages
              shell: bash
              env:
                  TAG: ${{ needs.version.outputs.new_tag }}
              run: |
                  set -euo pipefail

                  build_deb() {
                    local arch="$1" bin="$2"
                    local root
                    root="$(mktemp -d)"
                    local stage="${root}/opt/ctrlirl"
                    mkdir -p "${stage}"

                    # The compiled client, at the app root (the binary dir the
                    # declarative installer reads its sidecars from).
                    install -m 0755 "${bin}" "${stage}/ctrlirl"

                    # Every module's install/ sidecar tree, laid out relative
                    # to the binary exactly as the installer expects.
                    local d id
                    for d in client/modules/*/install; do
                      [ -d "${d}" ] || continue
                      id="$(basename "$(dirname "${d}")")"
                      mkdir -p "${stage}/client/modules/${id}/install"
                      cp -r "${d}/." "${stage}/client/modules/${id}/install/"
                    done
                    find "${stage}/client/modules" \
                      \( -name 'install.sh' -o -name 'uninstall.sh' \) \
                      -exec chmod 0755 {} +

                    mkdir -p "${root}/DEBIAN"
                    {
                      echo "Package: ctrlirl-coder"
                      echo "Version: ${TAG}"
                      echo "Architecture: ${arch}"
                      echo "Maintainer: Michal Vondráček <michal.vondracek@optimal4.cz>"
                      echo "Section: net"
                      echo "Priority: optional"
                      echo "Depends: ca-certificates"
                      echo "Description: CtrlIRL device client"
                      echo " CtrlIRL streaming device client (role-driven). Bundles"
                      echo " the compiled client binary and the per-module install"
                      echo " sidecar trees. The payload deploys to /opt/ctrlirl; run"
                      echo "/opt/ctrlirl/ctrlirl --host 0.0.0.0 <role>."
                    } > "${root}/DEBIAN/control"

                    dpkg-deb --build --root-owner-group "${root}" \
                      "dist/ctrlirl-coder_${TAG}_${arch}.deb" >/dev/null
                    rm -rf "${root}"
                  }

                  build_deb amd64 dist/client
                  build_deb arm64 dist/client-arm

                  echo "Built debs:"
                  ls -la dist/ctrlirl-coder_*.deb

            - uses: actions/upload-artifact@v7
              with:
                  name: ctrlirl-coder-debs
                  path: |
                      dist/ctrlirl-coder_*.deb

    publish-server-docker:
        needs: version
        if: needs.version.outputs.new_tag != ''
        runs-on: ubuntu-latest
        steps:
            # Same as the build job: check out the tag so the image is built
            # from the commit carrying the bumped package.json.
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.version.outputs.new_tag }}

            - uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push server image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  platforms: linux/amd64
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                  tags: |
                      ghcr.io/${{ github.repository }}-server:${{ needs.version.outputs.new_tag }}
                      ghcr.io/${{ github.repository }}-server:latest

    release:
        needs: [version, build, deb, publish-server-docker]
        if: needs.version.outputs.new_tag != ''
        runs-on: ubuntu-latest
        steps:
            # Merges every artifact into artifacts/: the client, client-arm and
            # server binaries plus the two ctrlirl-coder .deb packages.
            - uses: actions/download-artifact@v8
              with:
                  path: artifacts
                  pattern: '*'
                  merge-multiple: true

            - name: Create release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ needs.version.outputs.new_tag }}
                  name: Release ${{ needs.version.outputs.new_tag }}
                  # Release body is already set by semantic-release (conventional
                  # commit changelog); this step only attaches the binaries and
                  # the ctrlirl-coder .deb packages.
                  files: artifacts/*
                  token: ${{ secrets.GITHUB_TOKEN }}
