name: Release

on:
    push:
        branches: [main]
    workflow_dispatch: {}

permissions:
    contents: write
    packages: write

jobs:
    version:
        runs-on: ubuntu-latest
        outputs:
            new_tag: ${{ steps.semver.outputs.new_tag }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v7
              with:
                  node-version: 22

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            # Installs devDependencies so that the plugins listed in
            # .releaserc.json (e.g. @semantic-release/git) can be resolved.
            - name: Install dependencies
              shell: bash
              run: bun install

            - name: Semantic versioning (semantic-release)
              id: semver
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # Analyzes conventional commits since the last tag and, when a
                  # bump is warranted, prepends the notes to CHANGELOG.md, commits
                  # it with the version bump, and publishes the tag + GitHub release.
                  npx --yes semantic-release@24

                  # Detect whether this push was released: semantic-release tags HEAD.
                  git fetch --force --tags
                  TAG="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
                  if [ -n "$TAG" ] && [ "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)" ]; then
                    echo "new_tag=${TAG}" >> "$GITHUB_OUTPUT"
                  fi

    build:
        needs: version
        if: needs.version.outputs.new_tag != ''
        # The artifact name doubles as the GitHub release asset name. Linux
        # builds keep bare names (client, client-arm, server) so the deb stage
        # picks up the Linux clients by name; other platforms are suffixed with
        # an OS label.
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      name: client
                      target: bun-linux-x64
                      entrypoint: ./client/backend/client.ts
                      native: true
                      profile: true
                      ext: ""
                    - os: ubuntu-latest
                      name: client-arm
                      target: bun-linux-arm64
                      entrypoint: ./client/backend/client.ts
                      native: false
                      profile: false
                      ext: ""
                    - os: ubuntu-latest
                      name: server
                      target: bun-linux-x64
                      entrypoint: ./server/main.ts
                      native: true
                      profile: false
                      ext: ""
                    - os: macos-latest
                      name: client-macos
                      target: bun-darwin-arm64
                      entrypoint: ./client/backend/client.ts
                      native: true
                      profile: true
                      ext: ""
                    - os: windows-latest
                      name: client-windows
                      target: bun-windows-x64
                      entrypoint: ./client/backend/client.ts
                      native: true
                      profile: false
                      ext: ".exe"
        runs-on: ${{ matrix.os }}
        steps:
            # Check out the release tag, not the trigger commit:
            # semantic-release commits the package.json bump in the `version`
            # job, so github.sha still carries the previous version and the
            # binaries would embed the stale APP_VERSION.
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.version.outputs.new_tag }}

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              shell: bash
              run: bun install

            # Generated before every compile: module manifests, page manifests,
            # and the control-server web UI the client embeds
            # (shared/frontend.ts → generated/frontend-assets.ts).
            - name: Generate module manifests
              shell: bash
              run: bun run gen:modules

            - name: Generate pages
              shell: bash
              run: bun run gen:pages

            - name: Generate control-server assets
              shell: bash
              run: bun scripts/gen_control_server_assets.ts

            # Binaries are written to dist/ so the --outfile never collides with
            # a source directory (e.g. `server` is both a source dir and the
            # server binary name). The artifact name stays matrix.name, so the
            # deb stage keeps fetching `client`/`client-arm` by name and the
            # release assets keep their bare names.
            - name: Build profiling binaries (profiled targets only)
              if: matrix.profile == true
              shell: bash
              run: |
                  mkdir -p dist
                  bun build --compile --minify --sourcemap \
                    --target=${{ matrix.target }} \
                    ${{ matrix.entrypoint }} \
                    --outfile dist/prof-${{ matrix.name }}${{ matrix.ext }}

            - name: Record bytecode profiles (profiled targets only)
              if: matrix.profile == true
              shell: bash
              run: |
                  BUN_BYTECODE_ORDER_OUT=client.order ./dist/prof-${{ matrix.name }}${{ matrix.ext }} --help

            - name: Build final binaries
              shell: bash
              run: |
                  mkdir -p dist
                  ARGS="--compile --minify --sourcemap --format=esm --bytecode \
                    --target=${{ matrix.target }} \
                    ${{ matrix.entrypoint }} \
                    --outfile dist/${{ matrix.name }}${{ matrix.ext }}"
                  if [ -f client.order ]; then
                    ARGS="$ARGS --bytecode-order=client.order"
                  fi
                  bun build $ARGS

            - name: Verify binaries (profiled targets only)
              if: matrix.profile == true
              shell: bash
              run: |
                  chmod +x dist/${{ matrix.name }}${{ matrix.ext }} || true
                  ./dist/${{ matrix.name }}${{ matrix.ext }} --help

            - uses: actions/upload-artifact@v7
              with:
                  # Bare name key so the Linux client/client-arm stay
                  # fetchable by name from the deb stage; the asset file itself
                  # carries the platform extension.
                  name: ${{ matrix.name }}
                  path: dist/${{ matrix.name }}${{ matrix.ext }}

    deb:
        needs: [version, build]
        if: needs.version.outputs.new_tag != ''
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.version.outputs.new_tag }}

            # Reuse the compiled Linux client binaries from the build job — the
            # deb wraps them plus the module install sidecar trees (the exact
            # layout scripts/package_client.ts ships for the on-device deploy
            # bundle). Fetched by exact name so the macOS/Windows clients are
            # never pulled in.
            - name: Download Linux client binaries
              uses: actions/download-artifact@v8
              with:
                  name: client
                  path: dist

            - name: Download Linux client-arm binary
              uses: actions/download-artifact@v8
              with:
                  name: client-arm
                  path: dist

            - name: Build .deb packages
              shell: bash
              env:
                  TAG: ${{ needs.version.outputs.new_tag }}
              run: |
                  set -euo pipefail

                  # Debian package versions must start with a digit, so strip
                  # the git tag's `v` prefix for the control field and filename.
                  DEB_VERSION="${TAG#v}"

                  build_deb() {
                    local arch="$1" bin="$2"
                    local root
                    root="$(mktemp -d)"
                    local stage="${root}/opt/ctrlirl"
                    mkdir -p "${stage}"

                    # The compiled client, at the app root (the binary dir the
                    # declarative installer reads its sidecars from).
                    install -m 0755 "${bin}" "${stage}/ctrlirl"

                    # Every module's install/ sidecar tree, laid out relative
                    # to the binary exactly as the installer expects.
                    local d id
                    for d in client/modules/*/install; do
                      [ -d "${d}" ] || continue
                      id="$(basename "$(dirname "${d}")")"
                      mkdir -p "${stage}/client/modules/${id}/install"
                      cp -r "${d}/." "${stage}/client/modules/${id}/install/"
                    done
                    find "${stage}/client/modules" \
                      \( -name 'install.sh' -o -name 'uninstall.sh' \) \
                      -exec chmod 0755 {} +

                    mkdir -p "${root}/DEBIAN"
                    {
                      echo "Package: ctrlirl-coder"
                      echo "Version: ${DEB_VERSION}"
                      echo "Architecture: ${arch}"
                      echo "Maintainer: Michal Vondráček <michal.vondracek@optimal4.cz>"
                      echo "Section: net"
                      echo "Priority: optional"
                      echo "Depends: ca-certificates"
                      echo "Description: CtrlIRL device client"
                      echo " CtrlIRL streaming device client (role-driven). Bundles"
                      echo " the compiled client binary and the per-module install"
                      echo " sidecar trees. The payload deploys to /opt/ctrlirl; run"
                      echo " /opt/ctrlirl/ctrlirl --host 0.0.0.0 <role>."
                    } > "${root}/DEBIAN/control"

                    dpkg-deb --build --root-owner-group "${root}" \
                      "dist/ctrlirl-coder_${DEB_VERSION}_${arch}.deb" >/dev/null
                    rm -rf "${root}"
                  }

                  build_deb amd64 dist/client
                  build_deb arm64 dist/client-arm

                  echo "Built debs:"
                  ls -la dist/ctrlirl-coder_*.deb

            - uses: actions/upload-artifact@v7
              with:
                  name: ctrlirl-coder-debs
                  path: |
                      dist/ctrlirl-coder_*.deb

    # Publishes the Linux ctrlirl-coder debs as a static, GPG-signed apt
    # repository on GitHub Pages (majklovec.github.io/ctrlirl/deb). The Release
    # metadata is hand-rolled (not apt-ftparchive) so apt 3.x sees the exact
    # per-arch Packages targets, is signed with secrets.CTRLIRL_GPG_KEY, and
    # ships the public key at /deb/ctrlirl.asc. Independent of `release` so the
    # GitHub Release is never gated on Pages.
    pages:
        needs: [version, deb]
        if: needs.version.outputs.new_tag != ''
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
        env:
            # GitHub Pages base URL for this repo (user.github.io/<repo>).
            APT_BASE: https://majklovec.github.io/ctrlirl
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.version.outputs.new_tag }}

            # Pull the Linux debs built by the deb job.
            - name: Download ctrlirl-coder debs
              uses: actions/download-artifact@v8
              with:
                  name: ctrlirl-coder-debs
                  path: debs

            - name: Install apt packaging tools
              # apt-utils provides apt-ftparchive (Release metadata); the runner
              # image ships apt but not apt-utils. dpkg-dev for dpkg-scanpackages,
              # gnupg for signing.
              run: sudo apt-get update && sudo apt-get install -y apt-utils dpkg-dev gnupg

            # Import the release GPG key (armored private key) so the Release can
            # be signed; the public key is exported to site/deb/ctrlirl.asc below.
            - name: Import GPG release key
              env:
                  CTRLIRL_GPG_KEY: ${{ secrets.CTRLIRL_GPG_KEY }}
              run: |
                  set -euo pipefail
                  [ -n "${CTRLIRL_GPG_KEY:-}" ] || {
                    echo "secrets.CTRLIRL_GPG_KEY is not set - cannot sign the apt Release."
                    echo "Add the release key (armored private key) as a repo secret."; exit 1;
                  }
                  printf '%s' "$CTRLIRL_GPG_KEY" > /tmp/ctrlirl-key.asc
                  gpg --batch --import /tmp/ctrlirl-key.asc
                  gpg --batch --list-secret-keys

            - name: Build apt repo (main)
              run: |
                  set -euo pipefail
                  # Canonical apt layout: a single Codename (ctrlirl) with `main`
                  # as the component. apt resolves
                  # dists/ctrlirl/main/binary-<arch>/Packages[.gz] and joins the
                  # Packages Filename: field to the repository ROOT - so it must
                  # be root-relative.
                  SITE="site/deb"
                  DIST="$SITE/dists/ctrlirl"
                  mkdir -p "$DIST/main"

                  # Ship the public key so consumers can [signed-by=] it. No
                  # explicit userid: export whatever key CTRLIRL_GPG_KEY imported,
                  # regardless of its name/email.
                  gpg --batch --yes --armor --export > "$SITE/ctrlirl.asc"
                  [ -s "$SITE/ctrlirl.asc" ] || { echo "GPG public key export is empty"; exit 1; }

                  # Move the debs into per-arch binary dirs.
                  for f in debs/*.deb; do
                    [ -e "$f" ] || continue
                    arch=$(dpkg-deb -f "$f" Architecture)
                    mkdir -p "$DIST/main/binary-$arch"
                    cp "$f" "$DIST/main/binary-$arch/"
                  done
                  [ "$(ls "$DIST"/main/binary-*/*.deb 2>/dev/null | wc -l)" -gt 0 ] \
                    || { echo "no debs to publish"; exit 1; }

                  # Per-arch Packages: scan each arch dir from the repository ROOT
                  # so Filename: is root-relative (dists/.../binary-<arch>/<deb>) -
                  # that path is what apt joins to the repo root. -k keeps the
                  # uncompressed Packages; apt 3.x only fetches index targets whose
                  # canonical (uncompressed) form is in the Release hash table.
                  for d in "$DIST"/main/binary-*; do
                    [ -e "$d" ] || continue
                    rel=${d#"$SITE"/}
                    ( cd "$SITE" && dpkg-scanpackages --multiversion "$rel" /dev/null > "$rel/Packages" 2>/dev/null )
                    gzip -9kf "$d/Packages"
                  done

                  # Hand-rolled, signed Release (NOT apt-ftparchive): with only
                  # {Origin,Label,Suite,Codename} set, apt-ftparchive detects no
                  # Architectures/Components for this layout and never lists the
                  # uncompressed Packages target, so apt 3.x skips every index
                  # ("Unable to locate package"). Emit the exact per-arch
                  # Packages[.gz] hash entries, listing BOTH the plain and gzipped
                  # index. Signing is REQUIRED: an unsigned Release makes apt 3.x
                  # silently skip the index fetch.
                  archs=$(ls -d "$DIST"/main/binary-*/ 2>/dev/null | xargs -n1 basename | sed 's/^binary-//' | LC_ALL=C sort -u | tr '\n' ' ')
                  {
                    echo 'Origin: CtrlIRL'
                    echo 'Label: ctrlirl'
                    echo 'Suite: stable'
                    echo 'Codename: ctrlirl'
                    echo "Architectures: ${archs% }"
                    echo 'Components: main'
                    echo 'Description: CtrlIRL device client (releases)'
                    echo "Date: $(LC_ALL=C date -u -R)"
                    for h in MD5Sum SHA1 SHA256; do
                      case $h in
                        MD5Sum) hsum=md5sum ;; SHA1) hsum=sha1sum ;; SHA256) hsum=sha256sum ;;
                      esac
                      echo "$h:"
                      ( cd "$SITE" && find dists/ctrlirl \( -name 'Packages' -o -name 'Packages.gz' \) | LC_ALL=C sort |
                        while IFS= read -r f; do
                          rel=${f#dists/ctrlirl/}
                          printf ' %s %s %s\n' "$($hsum "$f" | cut -d' ' -f1)" "$(stat -c %s "$f")" "$rel"
                        done )
                    done
                  } > "$DIST/Release"
                  gpg --batch --yes --pinentry-mode loopback --passphrase '' \
                    --clearsign --output "$DIST/InRelease" "$DIST/Release"
                  gpg --batch --yes --pinentry-mode loopback --passphrase '' \
                    --detach-sign --output "$DIST/Release.gpg" "$DIST/Release"
                  ls -lR site

            - name: Write index.html (apt repo + .deb list)
              run: |
                  set -euo pipefail
                  BASE="${APT_BASE}/deb"
                  # Dynamic deb table rows.
                  ROWS=""
                  for f in "site/deb/dists/ctrlirl/main"/binary-*/*.deb; do
                    [ -e "$f" ] || continue
                    arch=$(basename "$(dirname "$f")" | sed 's/^binary-//')
                    ver=$(dpkg-deb -f "$f" Version 2>/dev/null || true)
                    size=$(( $(stat -c %s "$f") / 1024 ))
                    rel=${f#site/}
                    ROWS="${ROWS}<tr><td>${ver}</td><td>${arch}</td><td>${size} KiB</td><td><a href=\"${rel}\">${rel}</a></td></tr>"
                  done
                  cat > site/index.html <<HTML
                  <!DOCTYPE html>
                  <html lang="en"><head><meta charset="utf-8">
                  <title>CtrlIRL - deb packages</title>
                  <style>
                  body{font-family:system-ui,sans-serif;margin:2rem;max-width:64rem}
                  table{border-collapse:collapse;width:100%}
                  th,td{border:1px solid #ccc;padding:.4rem .7rem;text-align:left}
                  th{background:#f2f2f2}
                  pre{background:#f6f6f6;padding:.8rem;overflow-x:auto}
                  a{color:#0366d6}
                  </style></head><body>
                  <h1>CtrlIRL - deb packages</h1>
                  <p>Static apt-style repository, GPG-signed - key at <a href="deb/ctrlirl.asc">deb/ctrlirl.asc</a>. Published by the CI <code>pages</code> job.</p>
                  <h2>Add the repository</h2>
                  <pre>sudo mkdir -p /etc/apt/keyrings
                  curl -fsSL ${BASE}/ctrlirl.asc -o /etc/apt/keyrings/ctrlirl.asc
                  echo "deb [signed-by=/etc/apt/keyrings/ctrlirl.asc] ${BASE} ctrlirl main" | sudo tee /etc/apt/sources.list.d/ctrlirl-coder.list
                  sudo apt-get update
                  sudo apt-get install ctrlirl-coder</pre>
                  <h2>Debs</h2>
                  <table><tr><th>Version</th><th>Architecture</th><th>Size</th><th>File</th></tr>
                  ${ROWS}
                  </table>
                  </body></html>
                  HTML
                  head -30 site/index.html

            - name: Write site README
              run: |
                  set -euo pipefail
                  BASE="${APT_BASE}/deb"
                  cat > site/README.md <<'README'
                  # CtrlIRL - deb package repository

                  Single component `main` (release debs), signed with the key at
                  `__APT_BASE__/ctrlirl.asc`:

                  ```sh
                  sudo mkdir -p /etc/apt/keyrings
                  curl -fsSL __APT_BASE__/ctrlirl.asc -o /etc/apt/keyrings/ctrlirl.asc
                  echo "deb [signed-by=/etc/apt/keyrings/ctrlirl.asc] __APT_BASE__ ctrlirl main" | sudo tee /etc/apt/sources.list.d/ctrlirl-coder.list
                  sudo apt-get update
                  sudo apt-get install ctrlirl-coder
                  ```

                  `sudo apt-get upgrade ctrlirl-coder` follows the newest release
                  once it is published here.
                  README
                  sed -i "s|__APT_BASE__|${BASE}|g" site/README.md

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: site

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
              continue-on-error: true

            # Transient artifact-metadata fetch failures ("No artifacts named
            # github-pages were found") are GitHub-side hiccups: the artifact is
            # uploaded, so retry the deploy (NO re-upload - no duplicate artifact).
            - name: Wait before deploy retry
              if: steps.deployment.outcome == 'failure'
              run: sleep 60

            - name: Deploy to GitHub Pages (retry)
              if: steps.deployment.outcome == 'failure'
              uses: actions/deploy-pages@v5

    publish-server-docker:
        needs: version
        if: needs.version.outputs.new_tag != ''
        runs-on: ubuntu-latest
        steps:
            # Same as the build job: check out the tag so the image is built
            # from the commit carrying the bumped package.json.
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.version.outputs.new_tag }}

            - uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push server image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  platforms: linux/amd64
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                  tags: |
                      ghcr.io/${{ github.repository }}-server:${{ needs.version.outputs.new_tag }}
                      ghcr.io/${{ github.repository }}-server:latest

    release:
        needs: [version, build, deb, publish-server-docker]
        if: needs.version.outputs.new_tag != ''
        runs-on: ubuntu-latest
        steps:
            # Merges every artifact into artifacts/: the client, client-arm and
            # server binaries plus the two ctrlirl-coder .deb packages.
            - uses: actions/download-artifact@v8
              with:
                  path: artifacts
                  pattern: '*'
                  merge-multiple: true

            - name: Create release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ needs.version.outputs.new_tag }}
                  name: Release ${{ needs.version.outputs.new_tag }}
                  # Release body is already set by semantic-release (conventional
                  # commit changelog); this step only attaches the binaries and
                  # the ctrlirl-coder .deb packages.
                  files: artifacts/*
                  token: ${{ secrets.GITHUB_TOKEN }}
