<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img"
  aria-label="Capability bus: modules provide and consume capabilities">
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="7" markerHeight="7"
      orient="auto">
      <path d="M0,10 L5,0 L10,10 z" fill="#4a9eff" />
    </marker>
    <marker id="down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7"
      orient="auto">
      <path d="M0,0 L5,10 L10,0 z" fill="#8b5cf6" />
    </marker>
  </defs>


  <!-- Providers row -->
  <text x="60" y="130" font-family="ui-monospace, monospace" font-size="12" font-weight="700"
    fill="#4a9eff">PROVIDERS</text>
  <g font-family="ui-monospace, monospace" font-size="14" text-anchor="middle" fill="#0f172a">
    <rect x="100" y="150" width="220" height="70" rx="10" fill="#eff6ff" stroke="#4a9eff"
      stroke-width="1.5" />
    <text x="210" y="180">network</text>
    <text x="210" y="202" font-size="11" fill="#1e40af">→ network.uplinks</text>

    <rect x="390" y="150" width="220" height="70" rx="10" fill="#eff6ff" stroke="#4a9eff"
      stroke-width="1.5" />
    <text x="500" y="180">modems</text>
    <text x="500" y="202" font-size="11" fill="#1e40af">→ modems.source</text>

    <rect x="680" y="150" width="220" height="70" rx="10" fill="#eff6ff" stroke="#4a9eff"
      stroke-width="1.5" />
    <text x="790" y="180">relay</text>
    <text x="790" y="202" font-size="11" fill="#1e40af">→ stream.relay</text>
  </g>

  <!-- arrows down to bus -->
  <g stroke="#4a9eff" stroke-width="2" fill="none">
    <line x1="210" y1="222" x2="210" y2="258" marker-end="url(#down)" />
    <line x1="500" y1="222" x2="500" y2="258" marker-end="url(#down)" />
    <line x1="790" y1="222" x2="790" y2="258" marker-end="url(#down)" />
  </g>

  <!-- Bus bar -->
  <rect x="40" y="260" width="920" height="60" rx="12" fill="#0f172a" />
  <text x="500" y="298" font-family="ui-monospace, monospace" font-size="16" font-weight="700"
    fill="#ffffff" text-anchor="middle" letter-spacing="2">CAPABILITY BUS</text>

  <!-- arrows up from bus to consumers -->
  <g stroke="#8b5cf6" stroke-width="2" fill="none">
    <line x1="300" y1="320" x2="300" y2="356" marker-end="url(#up)" />
    <line x1="700" y1="320" x2="700" y2="356" marker-end="url(#up)" />
  </g>

  <!-- Consumers row -->
  <text x="60" y="388" font-family="ui-monospace, monospace" font-size="12" font-weight="700"
    fill="#8b5cf6">CONSUMERS</text>
  <g font-family="ui-monospace, monospace" font-size="14" text-anchor="middle" fill="#0f172a">
    <rect x="190" y="400" width="220" height="70" rx="10" fill="#ede9fe" stroke="#8b5cf6"
      stroke-width="1.5" />
    <text x="300" y="430">encoder</text>
    <text x="300" y="452" font-size="11" fill="#5b21b6">uses network.uplinks</text>

    <rect x="590" y="400" width="220" height="70" rx="10" fill="#ede9fe" stroke="#8b5cf6"
      stroke-width="1.5" />
    <text x="700" y="430">broadcaster</text>
    <text x="700" y="452" font-size="11" fill="#5b21b6">uses stream.relay</text>
  </g>

  <text x="500" y="500" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12"
    fill="#64748b" text-anchor="middle">the core routes requests and events by name — it does not
    know what they mean</text>
</svg>