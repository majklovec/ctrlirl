<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img"
  aria-label="Roles and the modules they wire together">
  <defs>
    <marker id="rarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
      orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8" />
    </marker>
  </defs>

  <text x="600" y="46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20"
    font-weight="700" fill="#0f172a" text-anchor="middle">Roles → modules</text>
  <text x="600" y="72" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13"
    fill="#475569" text-anchor="middle">a role is just a declarative list of modules — no logic of
    its own</text>

  <!-- Center: role.ts -->
  <rect x="490" y="240" width="220" height="80" rx="12" fill="#0f172a" />
  <text x="600" y="275" font-family="ui-monospace, monospace" font-size="16" font-weight="700"
    fill="#ffffff" text-anchor="middle">role.ts</text>
  <text x="600" y="298" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8"
    text-anchor="middle">client/roles/&lt;name&gt;/role.ts</text>

  <!-- role cards (5, arranged around) -->
  <!-- encoder (default) -->
  <line x1="490" y1="260" x2="290" y2="180" stroke="#94a3b8" stroke-width="1.5"
    marker-end="url(#rarr)" />
  <rect x="60" y="120" width="230" height="120" rx="10" fill="#ffffff" stroke="#4a9eff"
    stroke-width="1.5" />
  <text x="80" y="148" font-family="ui-monospace, monospace" font-size="14" font-weight="700"
    fill="#1e40af">encoder</text>
  <text x="80" y="170" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11"
    fill="#64748b">default role</text>
  <g font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">
    <text x="80" y="196">encoder · network</text>
    <text x="80" y="214">modems · obs · ssh</text>
  </g>

  <!-- obs (top right) -->
  <line x1="710" y1="260" x2="910" y2="180" stroke="#94a3b8" stroke-width="1.5"
    marker-end="url(#rarr)" />
  <rect x="910" y="120" width="230" height="120" rx="10" fill="#ffffff" stroke="#a855f7"
    stroke-width="1.5" />
  <text x="930" y="148" font-family="ui-monospace, monospace" font-size="14" font-weight="700"
    fill="#6b21a8">obs</text>
  <text x="930" y="170" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11"
    fill="#64748b">scene switching</text>
  <g font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">
    <text x="930" y="196">obs</text>
  </g>

  <!-- broadcaster (mid right) -->
  <line x1="710" y1="280" x2="910" y2="280" stroke="#94a3b8" stroke-width="1.5"
    marker-end="url(#rarr)" />
  <rect x="910" y="240" width="230" height="80" rx="10" fill="#ffffff" stroke="#10b981"
    stroke-width="1.5" />
  <text x="930" y="268" font-family="ui-monospace, monospace" font-size="14" font-weight="700"
    fill="#065f46">broadcaster</text>
  <text x="930" y="288" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11"
    fill="#64748b">SRTLA in, RTMP out</text>
  <text x="930" y="308" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">
    broadcaster</text>

  <!-- ctrlink_relay (bottom right) -->
  <line x1="710" y1="290" x2="910" y2="380" stroke="#94a3b8" stroke-width="1.5"
    marker-end="url(#rarr)" />
  <rect x="910" y="340" width="230" height="120" rx="10" fill="#ffffff" stroke="#f59e0b"
    stroke-width="1.5" />
  <text x="930" y="368" font-family="ui-monospace, monospace" font-size="14" font-weight="700"
    fill="#78350f">ctrlink_relay</text>
  <text x="930" y="390" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11"
    fill="#64748b">transparent L3 bridge</text>
  <text x="930" y="414" font-family="ui-monospace, monospace" font-size="11" fill="#0f172a">
    ctrlink_relay</text>

  <text x="600" y="530" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12"
    fill="#64748b" text-anchor="middle">pick a role with --role &lt;name&gt;; each role starts
    exactly the modules listed in its role.ts</text>
</svg>